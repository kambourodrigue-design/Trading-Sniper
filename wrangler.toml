name = "trading-sniper"
main = "src/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

# --- Site (landing, dashboard, admin) servi par le même Worker : dossier public/ ---
# Seules les adresses /api/* passent par le code ; les pages statiques sont servies gratuitement par Cloudflare.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

# --- Ressources de PRODUCTION existantes : identifiants conservés à l’identique ---
[[d1_databases]]
binding = "DB"
database_name = "trading-sniper-db"
database_id = "18015a10-c86b-4a34-b258-d99c8a149a67"

[[kv_namespaces]]
binding = "CACHE"
id = "af432b022599425eab8bb245d8df40bc"

# --- Cron : toutes les 2 minutes ; un actif par passage, rotation des 15 marchés sur ~30 minutes ---
[triggers]
crons = ["*/2 * * * *"]

# Journaux visibles dans le dashboard Cloudflare (utile pour diagnostiquer)
[observability]
enabled = true

# Réglages (modifiables sans toucher au code)
[vars]
MAX_PER_RUN = "1"              # actifs analysés par passage : "1" sur Workers Free (limite CPU 10 ms) ; "4" sur Workers Paid
PROFILE = "active"             # sélectivité des règles : strict, balanced ou active (profil actuel conservé)
AI_INDEPENDENT = "off"          # désactivé : GPT ne génère pas de signaux indépendants
AI_PREFILTER_SCORE = "30"
AUTONOMOUS_ONLY = "false"
HYBRID_GPT = "true"
OPENAI_MODEL = "gpt-6-luna"       # second avis GPT sur le setup : modèle GPT-6 le plus économique
FUNDAMENTAL_SOL = "true"          # 2e couche d'analyse fondamentale par GPT-6 Sol (appelée seulement quand un signal est publié)
OPENAI_SOL_MODEL = "gpt-6-sol"    # modèle de la couche fondamentale (la doc OpenAI signale aussi un GPT-6.1 Sol plus récent : vérifie son identifiant avant de l'utiliser)
OPENAI_SOL_EFFORT = "medium"      # effort de raisonnement de Sol : low, medium, high, xhigh ou max (plus haut = plus cher)

# Secrets à créer dans le dashboard (Worker > Paramètres > Variables et secrets > type « Secret ») :
#   JWT_SECRET, ADMIN_EMAILS
#   Données marché : biquote (sans clé) ; replis crypto : Kraken et Binance (sans clé).
#   OPENAI_API_KEY (Secret) pour le second avis GPT (gpt-6-luna) et la couche fondamentale (gpt-6-sol).
#   HYBRID_GPT=true : GPT enrichit les signaux autonomes, mais ne peut ni les bloquer ni modifier leurs niveaux (Luna = second avis ; Sol = analyse fondamentale).
#   optionnel : TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (notifications Telegram)
#   plus tard : STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, CINETPAY_API_KEY, CINETPAY_SITE_ID
