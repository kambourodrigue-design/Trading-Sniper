name = "trading-sniper"
main = "src/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

# --- Site (landing, dashboard, admin) servi par le même Worker : dossier public/ ---
# Seules les adresses /api/* passent par le code ; les pages statiques sont servies gratuitement par Cloudflare.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

# --- Ressources de PRODUCTION existantes : identifiants conservés à l’identique ---
[[d1_databases]]
binding = "DB"
database_name = "trading-sniper-db"
database_id = "18015a10-c86b-4a34-b258-d99c8a149a67"

[[kv_namespaces]]
binding = "CACHE"
id = "af432b022599425eab8bb245d8df40bc"

# --- Cron : toutes les 2 minutes ; un actif par passage, rotation des 15 marchés sur ~30 minutes ---
[triggers]
crons = ["*/2 * * * *"]

# Journaux visibles dans le dashboard Cloudflare (utile pour diagnostiquer)
[observability]
enabled = true

# Réglages (modifiables sans toucher au code)
[vars]
MAX_PER_RUN = "1"              # actifs analysés par passage : "1" sur Workers Free (limite CPU 10 ms) ; "4" sur Workers Paid
PROFILE = "adaptive"          # seuils adaptés à l’alignement H4/D1 ; filtres de risque conservés
AI_INDEPENDENT = "off"          # désactivé : GPT ne génère pas de signaux indépendants
AI_PREFILTER_SCORE = "30"\nTELEGRAM_V2_ENABLED = "true"\nTELEGRAM_V2_MIN_SCORE = "75"
AUTONOMOUS_ONLY = "false"
HYBRID_GPT = "true"
OPENAI_MODEL = "gpt-6-luna"
OPENAI_EFFORT = "medium"

# Secrets à créer dans le dashboard (Worker > Paramètres > Variables et secrets > type « Secret ») :
#   JWT_SECRET, ADMIN_EMAILS
#   Données marché : BiQuote, avec Yahoo Finance comme unique repli.
#   OPENAI_API_KEY ou DEEPSEEK_API_KEY (Secrets facultatifs) : OpenAI est prioritaire, DeepSeek sert de repli pour le second avis.
#   OPENAI_MODEL=gpt-6-luna et OPENAI_EFFORT=medium sont configurés ; l’API est facturée séparément de ChatGPT.
#   HYBRID_GPT=true : le second avis IA enrichit le signal autonome, sans le bloquer ni modifier ses niveaux.
#   optionnel : TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (notifications Telegram Origin et V2)\n#   TELEGRAM_V2_ENABLED=true et TELEGRAM_V2_MIN_SCORE=75 : alertes des setups virtuels V2
#   plus tard : STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, CINETPAY_API_KEY, CINETPAY_SITE_ID
